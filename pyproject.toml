[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-alert-agent"
version = "0.1.0"
description = "AML alert investigation agent: the model reads, code decides, a human approves. Verified case rationales, SAR drafts, sanctions screening, and a governance pack generated by CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sreenivas Bolla" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
dev = ["pytest>=8"]

[project.scripts]
amlagent = "amlagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "evals"]
testpaths = ["tests"]
